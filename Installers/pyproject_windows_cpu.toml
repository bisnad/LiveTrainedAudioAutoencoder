[project]
name = "ltaa"
version = "0.1.0"
description = "Live Trained Audio Autoencoder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "numpy",
    "vocos",
    "librosa>=0.11.0",
    "auraloss",
    "sounddevice",
    "soundfile>=0.13.1",
    "PyQt5",
    "vispy",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
